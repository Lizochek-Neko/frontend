<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend 1.0</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; }
        textarea { width: 100%; height: 100px; }
        button { margin-top: 10px; padding: 8px 20px; }
        #result { margin-top: 15px; color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Frontend 1.0</h1>
        <form id="form">
            <label for="text">Введите текст:</label><br>
            <textarea id="text" name="text" required></textarea><br>
            <button type="submit">Отправить</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('text').value;
            const formData = new FormData();
            formData.append('text', text);

            try {
                const resp = await fetch('/send', { method: 'POST', body: formData });
                const data = await resp.json();
                document.getElementById('result').textContent =
                    data.status === 'success' ? '✅ Данные отправлены!' : '❌ Ошибка';
            } catch (err) {
                document.getElementById('result').textContent = '❌ Ошибка соединения';
            }
        });
    </script>
</body>
</html>
